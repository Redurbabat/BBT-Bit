# BBT-Bit native iOS/iPadOS unsigned IPAs.
# Fast Debug IPA is used for PR feedback. Release archive remains manual.
# Both outputs require signing before installation on an unmodified iPhone.
definitions:
  ios_cache: &ios_cache
    cache_paths:
      # Codemagic caches are per-workflow and expire after 14 days.
      # Do not cache the whole Xcode DerivedData directory.
      - $HOME/.gradle/caches
      - $HOME/.gradle/wrapper/dists
      - $HOME/.konan
      - $HOME/.cargo/registry
      - $HOME/.cargo/git
      - $HOME/Library/Caches/org.swift.swiftpm
      - $HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
      # tar.gz files preserve framework symlinks across cache restore.
      - $HOME/.cache/bbt-bit/ios-frameworks

  ios_artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - build/ios/ipa/*.zip
    - build/ios/logs/*.log
    - /tmp/xcodebuild_logs/*.log

  scripts:
    - &check_toolchain
      name: Check Apple toolchain and app identifier
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        xcodebuild -version
        java -version
        /usr/libexec/java_home -v 21
        grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.babat.bbtbit' AppleApp/project.yml
        grep -q 'CFBundleDisplayName: RED Bit' AppleApp/project.yml
        # Verify all three public pinned sources before Debug or Release IPA.
        python3 scripts/verify-automix-model-sources.py
        ./scripts/check-network-errors.sh

    - &install_native_tools
      name: Install XcodeGen, CMake and Rust
      script: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
        if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew is required on the Codemagic Mac image" >&2
          exit 1
        fi
        if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
        if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
        rustup default stable
        rustup target add aarch64-apple-darwin aarch64-apple-ios
        xcodegen --version
        cmake --version
        rustc --version
        cargo --version
        cd "$CM_BUILD_DIR"
        chmod +x gradlew scripts/build-shared-framework.sh scripts/build-native-core.sh scripts/package-ios-ipa.sh scripts/ci-ios-native-cache.sh

    - &kotlin_native_cache
      name: Restore or compile Kotlin/Native shared framework (Release)
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
        export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
        ./scripts/ci-ios-native-cache.sh kotlin

    - &rust_native_cache
      name: Restore or compile Rust audio framework and UniFFI bindings
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
        ./scripts/ci-ios-native-cache.sh rust

    - &generate_xcode_project
      name: Generate native Xcode project
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        export PATH="/opt/homebrew/bin:$PATH"
        xcodegen generate --spec AppleApp/project.yml
        test -d AppleApp/BitChord.xcodeproj
        test -d AppleApp/Frameworks/BitChordShared.xcframework
        test -d AppleApp/Frameworks/NativeCoreFFI.xcframework
        test -f AppleApp/Generated/NativeCore.swift

    - &build_fast_ipa
      name: Build and package fast unsigned Debug IPA (no archive)
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        APP_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION: "\([^"]*\)".*/\1/p' AppleApp/project.yml | head -n 1)"
        test -n "$APP_VERSION"
        mkdir -p build/ios/logs
        ./scripts/package-ios-ipa.sh "$APP_VERSION" --fast --output-dir build/ios/ipa 2>&1 | tee build/ios/logs/fast-ipa.log
        ls -lh build/ios/ipa/BBT-Bit-*-ios-debug-unsigned.ipa
        IPA="$(find build/ios/ipa -name 'BBT-Bit-*-ios-debug-unsigned.ipa' -type f -print -quit)"
        test -n "$IPA"
        unzip -p "$IPA" Payload/BitChord.app/Info.plist > /tmp/BBT-Bit-Info.plist
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/BBT-Bit-Info.plist)" = "com.babat.bbtbit"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' /tmp/BBT-Bit-Info.plist)" = "RED Bit"
        echo "OK: fast unsigned Debug IPA for iPhone/iPad — signing required before installation"

    - &build_release_ipa
      name: Archive and package unsigned Release BBT-Bit IPA
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        APP_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION: "\([^"]*\)".*/\1/p' AppleApp/project.yml | head -n 1)"
        test -n "$APP_VERSION"
        mkdir -p build/ios/logs
        ./scripts/package-ios-ipa.sh "$APP_VERSION" --output-dir build/ios/ipa 2>&1 | tee build/ios/logs/archive.log
        ls -lh build/ios/ipa/BBT-Bit-*-ios-unsigned.ipa
        IPA="$(find build/ios/ipa -name 'BBT-Bit-*-ios-unsigned.ipa' -type f -print -quit)"
        test -n "$IPA"
        unzip -p "$IPA" Payload/BitChord.app/Info.plist > /tmp/BBT-Bit-Info.plist
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/BBT-Bit-Info.plist)" = "com.babat.bbtbit"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' /tmp/BBT-Bit-Info.plist)" = "RED Bit"
        echo "OK: unsigned Release IPA — signing required before installation"

workflows:
  bbt-bit-ios-fast-ipa:
    name: BBT-Bit — Fast iPhone/iPad Debug IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    # PRs are checked quickly, including PRs targeting protected review branches.
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false
        - pattern: 'review-only/*'
          include: true
          source: false
        - pattern: 'fix/*'
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      xcode: 26.0
      java: 21
    cache: *ios_cache
    scripts:
      - *check_toolchain
      - *install_native_tools
      - *kotlin_native_cache
      - *rust_native_cache
      - *generate_xcode_project
      - *build_fast_ipa
    artifacts: *ios_artifacts

  bbt-bit-ios-ipa:
    name: BBT-Bit — iPhone/iPad unsigned Release IPA (manual)
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Full Release archive is intentionally manual to avoid duplicate PR builds.
    environment:
      xcode: 26.0
      java: 21
    cache: *ios_cache
    scripts:
      - *check_toolchain
      - *install_native_tools
      - *kotlin_native_cache
      - *rust_native_cache
      - *generate_xcode_project
      - *build_release_ipa
    artifacts: *ios_artifacts
